application:
  baseUrl: "http://localhost"
  insecure: true
  username: "admin"
  password: "admin"
  "yes": true
  namePrefix: "operator"
  namespaceIsolation: false
  skipCrds: true
  clusterAdmin: true
jenkins:
  active: false
features:
  monitoring:
    active: false
  argocd:
    active: true
    operator: false
    env: []
    resourceInclusionsCluster: "https://10.43.0.1:443"
  ingressNginx:
    active: true
content:
  repos:
    - url: https://github.com/cloudogu/gop-helm
      target: 3rd-party-dependencies/gop-helm
      overwriteMode: RESET
    - url: https://github.com/avetgit/gitops-playground
#    - url: file:///home/cl-pc-0087/src/gitops-playground
      path: examples/init-multi-tenancy
      ref: feature/init-multi-tenancy
      templating: true
      type: FOLDER_BASED
      overwriteMode: UPGRADE
    - url: https://github.com/cloudogu/spring-petclinic
      target: argocd/petclinic-plain
      ref: feature/gitops_ready
      targetRef: main
      overwriteMode: UPGRADE
      createJenkinsJob: true
    - url: https://github.com/cloudogu/spring-petclinic
      target: argocd/petclinic-helm
      ref: feature/gitops_ready
      targetRef: main
      overwriteMode: UPGRADE
      createJenkinsJob: true
    - url: https://github.com/avetgit/gitops-playground
      path: examples/example-apps-via-content-loader/
      ref: feature/init-multi-tenancy
      templating: true
      type: FOLDER_BASED
      overwriteMode: UPGRADE

  namespaces:
    - t1-scmm-argocd
    - t1-scmm-example-apps-production
    - t1-scmm-example-apps-staging
  variables:
    petclinic:
      baseDomain: "petclinic.localhost"
    nginx:
      baseDomain: "nginx.localhost"
    images:
      kubectl: "bitnamilegacy/kubectl:1.29"
      helm: "ghcr.io/cloudogu/helm:3.16.4-1"
      kubeval: "ghcr.io/cloudogu/helm:3.16.4-1"
      helmKubeval: "ghcr.io/cloudogu/helm:3.16.4-1"
      yamllint: "cytopia/yamllint:1.25-0.7"
      nginx: ""
      petclinic: "eclipse-temurin:17-jre-alpine"
      maven: ""
scm:
